name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'updates/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'updates/**'
      - 'docs/**'
      - '*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Test Suite
      env:
        PYTHONPATH: .
        MINIAGENT_WORKSPACE: /tmp/miniagent-workspace
        MINIAGENT_DB: /tmp/miniagent.db
      run: |
        python -m unittest discover -s tests
